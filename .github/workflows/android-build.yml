name: Android build SENE PATRÓN

on:
  push:
    branches:
      - sene-cloudflare-backend
      - 'fix/**'
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generar icono con el logotipo original SENE
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('src/main/res/drawable-nodpi/logo_sene_pv.png').convert('RGBA')
          icon = Image.new('RGBA', (512, 512), (8, 8, 8, 255))
          src.thumbnail((470, 470), Image.Resampling.LANCZOS)
          icon.alpha_composite(src, ((512-src.width)//2, (512-src.height)//2))
          icon.save('src/main/res/drawable-nodpi/ic_launcher_patron.png')
          PY

      - name: Instalar licencias Android
        run: yes | sdkmanager --licenses >/dev/null

      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK de depuración
        run: gradle --no-daemon assembleDebug

      - name: Preparar APK con nombre oficial
        run: |
          mkdir -p dist
          cp build/outputs/apk/debug/*.apk "dist/SENE PATRON-online.apk"

      - name: Publicar APK oficial para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: SENE PATRON-online
          path: "dist/SENE PATRON-online.apk"
          if-no-files-found: error
          retention-days: 14
