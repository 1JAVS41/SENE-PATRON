name: Android build SENE PATRÓN

on:
  push:
    branches:
      - sene-cloudflare-backend
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK del runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Generar icono con el logotipo original SENE
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('src/main/res/drawable-nodpi/logo_sene_pv.png').convert('RGBA')
          icon = Image.new('RGBA', (512, 512), (8, 8, 8, 255))
          src.thumbnail((470, 470), Image.Resampling.LANCZOS)
          icon.alpha_composite(src, ((512-src.width)//2, (512-src.height)//2))
          icon.save('src/main/res/drawable-nodpi/ic_launcher_patron.png')
          PY

      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK de depuración
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK de depuración para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: SENE-PATRON-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
