name: Android build SENE PATRÓN

on:
  push:
    branches:
      - sene-cloudflare-backend
      - fix/patron-gradle-toolchain
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"
  pull_request:
    branches:
      - sene-cloudflare-backend
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Localizar Android SDK y sdkmanager
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT" /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager. Directorios SDK disponibles:"
            ls -la "$SDK_ROOT" || true
            find /usr/local/lib/android -maxdepth 4 -type d 2>/dev/null | head -80 || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Generar icono con el logotipo original SENE
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('src/main/res/drawable-nodpi/logo_sene_pv.png').convert('RGBA')
          icon = Image.new('RGBA', (512, 512), (8, 8, 8, 255))
          src.thumbnail((470, 470), Image.Resampling.LANCZOS)
          icon.alpha_composite(src, ((512-src.width)//2, (512-src.height)//2))
          icon.save('src/main/res/drawable-nodpi/ic_launcher_patron.png')
          PY

      - name: Instalar plataforma y herramientas Android
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compilar APK de depuración
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK de depuración para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: SENE-PATRON-debug
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
