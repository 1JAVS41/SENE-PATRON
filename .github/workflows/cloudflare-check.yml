          sqlite3 "$DB_FILE" "INSERT INTO official_support_contacts (id, official_email, help_phone_1, help_phone_2, revision, registered_at, updated_at, updated_by) VALUES (1, 'ayuda@example.invalid', '+5211111111111', '+5222222222222', 1, 100, 100, 'operator-bootstrap');"
