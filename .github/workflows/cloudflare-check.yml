name: Cloudflare backend checks

on:
  push:
    branches:
      - sene-cloudflare-backend
    paths:
      - "cloudflare/sene-api/**"
      - ".github/workflows/cloudflare-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Comprobar sintaxis del Worker
        run: node --check cloudflare/sene-api/src/worker.js

      - name: Instalar SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Aplicar migraciones en una base temporal
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0001_initial.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0002_security_billing_usage.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0003_workflow_reports.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0004_device_history_replacements.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0005_monthly_renewals.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0006_device_replacement_flow.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0007_renewal_operator_audit.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0008_notification_seen_state.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0009_patron_recovery.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0010_payroll_settings.sql
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"
          sqlite3 "$DB_FILE" "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"

      - name: Probar restricciones de recuperación de PATRÓN
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, created_at, expires_at) VALUES ('license-recovery', 'TIENDA RECUPERACION', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-old', 'license-recovery', 'PATRON', 'install-old', 'continuity-old', x'01', 'fingerprint-old', 1, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO patron_recovery_requests (id, license_id, old_patron_device_id, code_hash, reason, status, created_at, created_by) VALUES ('recovery-1', 'license-recovery', 'patron-old', 'hash-one', 'telefono perdido', 'pending', 10, 'operator');"
          if sqlite3 "$DB_FILE" "INSERT INTO patron_recovery_requests (id, license_id, old_patron_device_id, code_hash, reason, status, created_at, created_by) VALUES ('recovery-duplicate', 'license-recovery', 'patron-old', 'hash-two', 'duplicada', 'pending', 11, 'operator');" 2>/dev/null; then
            echo "ERROR: se permitió más de una recuperación pendiente por licencia"
            exit 1
          fi
          sqlite3 "$DB_FILE" "UPDATE patron_recovery_requests SET status='consumed', consumed_at=20 WHERE id='recovery-1' AND status='pending';"
          sqlite3 "$DB_FILE" "INSERT INTO patron_recovery_requests (id, license_id, old_patron_device_id, code_hash, reason, status, created_at, created_by) VALUES ('recovery-2', 'license-recovery', 'patron-old', 'hash-two', 'segunda solicitud tras cerrar la anterior', 'pending', 21, 'operator');"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM patron_recovery_requests WHERE license_id='license-recovery' AND status='pending';")" = "1"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar límite semanal atómico de 20 operaciones
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0001_initial.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0002_security_billing_usage.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0003_workflow_reports.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0004_device_history_replacements.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0005_monthly_renewals.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0006_device_replacement_flow.sql
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, status, max_devices, created_at, expires_at) VALUES ('license-test', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('device-test', 'license-test', 'VENTAS', 'install-test', 'continuity-test', x'00', 'fingerprint-test', 2, 'active', 1);"
          for expected in $(seq 1 20); do
            actual="$(sqlite3 "$DB_FILE" "INSERT INTO weekly_usage (id, device_id, week_key, used, updated_at) VALUES (lower(hex(randomblob(16))), 'device-test', '2026-W46', 1, 1) ON CONFLICT(device_id, week_key) DO UPDATE SET used = weekly_usage.used + 1, updated_at = excluded.updated_at WHERE weekly_usage.used < 20 RETURNING used;")"
            test "$actual" = "$expected"
          done
          overflow="$(sqlite3 "$DB_FILE" "INSERT INTO weekly_usage (id, device_id, week_key, used, updated_at) VALUES (lower(hex(randomblob(16))), 'device-test', '2026-W46', 1, 1) ON CONFLICT(device_id, week_key) DO UPDATE SET used = weekly_usage.used + 1, updated_at = excluded.updated_at WHERE weekly_usage.used < 20 RETURNING used;")"
          test -z "$overflow"
          test "$(sqlite3 "$DB_FILE" "SELECT used FROM weekly_usage WHERE device_id='device-test' AND week_key='2026-W46';")" = "20"

      - name: Probar flujo de autorización de renovación de 30 días
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, created_at, expires_at) VALUES ('license-renew', 'ABARROTES TERE', 'expired', 3, 1, 100);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-renew', 'license-renew', 'PATRON', 'install-p', 'continuity-p', x'01', 'fingerprint-p', 1, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO renewal_requests (id, license_id, patron_device_id, business_name, status, created_at) VALUES ('renew-1', 'license-renew', 'patron-renew', 'ABARROTES TERE', 'pending_payment', 200);"
          if sqlite3 "$DB_FILE" "INSERT INTO renewal_requests (id, license_id, patron_device_id, status, created_at) VALUES ('renew-duplicate', 'license-renew', 'patron-renew', 'pending_payment', 201);" 2>/dev/null; then
            echo "ERROR: se permitió más de una renovación abierta por licencia"
            exit 1
          fi
          sqlite3 "$DB_FILE" "UPDATE renewal_requests SET status='authorized', code_hash='hash-once', authorized_at=300, payment_reference='folio-123' WHERE id='renew-1' AND status='pending_payment';"
          sqlite3 "$DB_FILE" "INSERT INTO payments (id, license_id, payment_type, amount_cents, currency, status, reference, idempotency_key, created_at, confirmed_at, confirmed_by) VALUES ('payment-renew', 'license-renew', 'MONTHLY_RENT', 8000, 'MXN', 'CONFIRMED', 'folio-123', 'renewal:renew-1', 300, 300, 'operator');"
          sqlite3 "$DB_FILE" "UPDATE renewal_requests SET status='consumed', consumed_at=400 WHERE id='renew-1' AND status='authorized' AND code_hash='hash-once';"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM renewal_requests WHERE id='renew-1';")" = "consumed"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM payments WHERE idempotency_key='renewal:renew-1' AND amount_cents=8000 AND status='CONFIRMED';")" = "1"
          sqlite3 "$DB_FILE" "UPDATE renewal_requests SET status='consumed', consumed_at=401 WHERE id='renew-1' AND status='authorized' AND code_hash='hash-once';"
          test "$(sqlite3 "$DB_FILE" "SELECT consumed_at FROM renewal_requests WHERE id='renew-1';")" = "400"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar alta inicial, pago de $580 y activación por 30 días
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, label, business_name, status, max_devices, activation_code_hash, created_at) VALUES ('license-initial', 'TIENDA TEST', 'TIENDA TEST', 'pending', 3, 'activation-hash', 100);"
          sqlite3 "$DB_FILE" "INSERT INTO payments (id, license_id, payment_type, amount_cents, currency, status, reference, idempotency_key, created_at, confirmed_at, confirmed_by) VALUES ('setup-payment', 'license-initial', 'SETUP', 50000, 'MXN', 'CONFIRMED', 'folio-580', 'initial-setup:license-initial', 200, 200, 'operator'), ('rent-payment', 'license-initial', 'FIRST_RENT', 8000, 'MXN', 'CONFIRMED', 'folio-580', 'initial-rent:license-initial', 200, 200, 'operator');"
          sqlite3 "$DB_FILE" "UPDATE licenses SET setup_paid_at=200, first_rent_paid_at=200 WHERE id='license-initial' AND status='pending';"
          test "$(sqlite3 "$DB_FILE" "SELECT SUM(amount_cents) FROM payments WHERE license_id='license-initial' AND status='CONFIRMED';")" = "58000"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) SELECT 'patron-initial', id, 'PATRON', 'install', 'continuity', x'01', 'fingerprint', 1, 'active', 300 FROM licenses WHERE id='license-initial' AND status='pending' AND setup_paid_at IS NOT NULL;"
          sqlite3 "$DB_FILE" "UPDATE licenses SET activation_code_hash=NULL WHERE id='license-initial' AND activation_code_hash='activation-hash' AND EXISTS (SELECT 1 FROM devices WHERE id='patron-initial' AND license_id=licenses.id);"
          sqlite3 "$DB_FILE" "UPDATE licenses SET status='active', activated_at=300, expires_at=2592300 WHERE id=(SELECT license_id FROM devices WHERE id='patron-initial') AND status='pending' AND setup_paid_at IS NOT NULL AND first_rent_paid_at IS NOT NULL;"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM licenses WHERE id='license-initial';")" = "active"
          test "$(sqlite3 "$DB_FILE" "SELECT expires_at FROM licenses WHERE id='license-initial';")" = "2592300"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar reemplazo conservando historial y referencias
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0001_initial.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0002_security_billing_usage.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0003_workflow_reports.sql
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, status, max_devices, created_at, expires_at) VALUES ('license-replace', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-old', 'license-replace', 'PATRON', 'install-p', 'continuity-p', x'01', 'fingerprint-p', 1, 'active', 1), ('ventas-old', 'license-replace', 'VENTAS', 'install-v1', 'continuity-v1', x'02', 'fingerprint-v1', 2, 'revoked', 2);"
          sqlite3 "$DB_FILE" "INSERT INTO pairing_tokens (token_hash, license_id, patron_device_id, remaining_uses, created_at, expires_at) VALUES ('token-hash', 'license-replace', 'patron-old', 1, 2, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO challenges (id, nonce, purpose, installation_id, created_at, expires_at, device_id, fingerprint) VALUES ('challenge-old', 'nonce', 'DEVICE_AUTH', 'install-v1', 2, 9999999999, 'ventas-old', 'fingerprint-v1');"
          sqlite3 "$DB_FILE" "INSERT INTO correction_requests (id, license_id, ventas_device_id, sale_id, reason, status, created_at) VALUES ('correction-old', 'license-replace', 'ventas-old', 'sale-1', 'test', 'cancelled', 2);"
          sqlite3 "$DB_FILE" "INSERT INTO correction_grants (id, request_id, license_id, ventas_device_id, sale_id, created_at) VALUES ('grant-old', 'correction-old', 'license-replace', 'ventas-old', 'sale-1', 2);"
          sqlite3 "$DB_FILE" "INSERT INTO weekly_usage (id, device_id, week_key, used, updated_at) VALUES ('usage-old', 'ventas-old', '2026-46', 3, 2);"
          sqlite3 "$DB_FILE" "INSERT INTO replacement_requests (id, license_id, old_device_id, slot_number, reason, status, created_at) VALUES ('replace-old', 'license-replace', 'ventas-old', 2, 'lost', 'approved', 2);"
          sqlite3 "$DB_FILE" "INSERT INTO audit_log (id, license_id, device_id, actor_type, event_type, created_at) VALUES ('audit-old', 'license-replace', 'ventas-old', 'system', 'device_revoked', 2);"
          sqlite3 "$DB_FILE" "INSERT INTO work_requests (id, license_id, ventas_device_id, request_type, details_json, created_at, idempotency_key) VALUES ('work-old', 'license-replace', 'ventas-old', 'SUGGESTION', '{}', 2, 'idempotency-old');"
          sqlite3 "$DB_FILE" "INSERT INTO shift_reports (id, license_id, ventas_device_id, shift_key, report_json, created_at) VALUES ('shift-old', 'license-replace', 'ventas-old', 'shift-1', '{}', 2);"
          sqlite3 "$DB_FILE" "INSERT INTO payroll_reports (id, license_id, ventas_device_id, period_key, report_json, created_at) VALUES ('payroll-old', 'license-replace', 'ventas-old', 'period-1', '{}', 2);"
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0004_device_history_replacements.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0005_monthly_renewals.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0006_device_replacement_flow.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0007_renewal_operator_audit.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0008_notification_seen_state.sql
          sqlite3 "$DB_FILE" < cloudflare/sene-api/migrations/0009_patron_recovery.sql
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('ventas-new', 'license-replace', 'VENTAS', 'install-v2', 'continuity-v2', x'03', 'fingerprint-v2', 2, 'active', 3);"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM devices WHERE license_id='license-replace' AND slot_number=2;")" = "2"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM devices WHERE id='ventas-old' AND status='revoked';")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM devices WHERE id='ventas-new' AND status='active';")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-old';")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM shift_reports WHERE ventas_device_id='ventas-old';")" = "1"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"
          if sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('ventas-duplicate', 'license-replace', 'VENTAS', 'install-v3', 'continuity-v3', x'04', 'fingerprint-v3', 2, 'active', 4);" 2>/dev/null; then
            echo "ERROR: se permitió un segundo dispositivo activo en el mismo espacio"
            exit 1
          fi

      - name: Probar autorización de reemplazo y liberación segura del espacio
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, created_at, expires_at) VALUES ('license-recovery', 'TIENDA RECOVERY', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-recovery', 'license-recovery', 'PATRON', 'ip', 'cp', x'01', 'fp', 1, 'active', 1), ('ventas-lost', 'license-recovery', 'VENTAS', 'iv', 'cv', x'02', 'fv', 2, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO pairing_tokens (token_hash, license_id, patron_device_id, remaining_uses, created_at, expires_at) VALUES ('pair-old', 'license-recovery', 'patron-recovery', 2, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO replacement_requests (id, license_id, old_device_id, slot_number, reason, status, created_at) VALUES ('replacement-1', 'license-recovery', 'ventas-lost', 2, 'Equipo perdido', 'pending', 2);"
          if sqlite3 "$DB_FILE" "INSERT INTO replacement_requests (id, license_id, old_device_id, slot_number, reason, status, created_at) VALUES ('replacement-duplicate', 'license-recovery', 'ventas-lost', 2, 'Duplicada', 'pending', 3);" 2>/dev/null; then
            echo "ERROR: se permitió una solicitud pendiente duplicada"
            exit 1
          fi
          sqlite3 "$DB_FILE" "UPDATE devices SET status='revoked' WHERE id='ventas-lost' AND status='active';"
          sqlite3 "$DB_FILE" "UPDATE replacement_requests SET status='approved', decided_at=10, decided_by='operator' WHERE id='replacement-1' AND status='pending' AND EXISTS (SELECT 1 FROM devices WHERE id='ventas-lost' AND status='revoked');"
          sqlite3 "$DB_FILE" "UPDATE pairing_tokens SET revoked_at=10 WHERE license_id='license-recovery' AND revoked_at IS NULL;"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('ventas-replacement', 'license-recovery', 'VENTAS', 'iv2', 'cv2', x'03', 'fv2', 2, 'active', 11);"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='ventas-lost';")" = "revoked"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM replacement_requests WHERE id='replacement-1';")" = "approved"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='ventas-replacement';")" = "active"
          test "$(sqlite3 "$DB_FILE" "SELECT revoked_at FROM pairing_tokens WHERE token_hash='pair-old';")" = "10"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar permiso de corrección de venta de un solo uso
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, status, max_devices, created_at, expires_at) VALUES ('license-correction', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-correction', 'license-correction', 'PATRON', 'ip', 'cp', x'01', 'fp', 1, 'active', 1), ('ventas-correction', 'license-correction', 'VENTAS', 'iv', 'cv', x'02', 'fv', 2, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO correction_requests (id, license_id, ventas_device_id, sale_id, reason, status, created_at, idempotency_key) VALUES ('correction-1', 'license-correction', 'ventas-correction', 'sale-42', 'Error de captura', 'pending', 2, 'idem-1');"
          sqlite3 "$DB_FILE" "INSERT INTO work_requests (id, license_id, ventas_device_id, request_type, details_json, status, created_at, idempotency_key) VALUES ('work-1', 'license-correction', 'ventas-correction', 'LOAN', '{}', 'pending', 2, 'work-idem-1');"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('ventas-correction-2', 'license-correction', 'VENTAS', 'iv2', 'cv2', x'03', 'fv2', 3, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO work_requests (id, license_id, ventas_device_id, request_type, details_json, status, created_at, idempotency_key) VALUES ('work-2', 'license-correction', 'ventas-correction-2', 'LOAN', '{}', 'pending', 2, 'work-idem-2');"
          test "$(sqlite3 "$DB_FILE" "SELECT (SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL) + (SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL);")" = "2"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          sqlite3 "$DB_FILE" "UPDATE work_requests SET seen_at=3 WHERE id='work-1' AND status='pending' AND seen_at IS NULL;"
          test "$(sqlite3 "$DB_FILE" "SELECT (SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL) + (SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL);")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          sqlite3 "$DB_FILE" "UPDATE correction_requests SET seen_at=4 WHERE id='correction-1' AND status='pending' AND seen_at IS NULL;"
          test "$(sqlite3 "$DB_FILE" "SELECT (SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL) + (SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL);")" = "0"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE id='work-1' AND status='pending';")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM correction_requests WHERE id='correction-1' AND status='pending';")" = "1"
          sqlite3 "$DB_FILE" "UPDATE correction_requests SET status='approved', decided_at=5 WHERE id='correction-1' AND status='pending';"
          sqlite3 "$DB_FILE" "INSERT INTO correction_grants (id, request_id, license_id, ventas_device_id, sale_id, uses_allowed, uses_consumed, created_at) SELECT 'grant-1', id, license_id, ventas_device_id, sale_id, 1, 0, 3 FROM correction_requests WHERE id='correction-1' AND status='approved';"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM correction_grants WHERE request_id='correction-1' AND uses_allowed=1 AND uses_consumed=0;")" = "1"
          sqlite3 "$DB_FILE" "UPDATE correction_grants SET uses_consumed=1, consumed_at=4 WHERE id='grant-1' AND request_id='correction-1' AND license_id='license-correction' AND ventas_device_id='ventas-correction' AND sale_id='sale-42' AND uses_consumed=0;"
          sqlite3 "$DB_FILE" "UPDATE correction_requests SET status='consumed' WHERE id='correction-1' AND status='approved' AND EXISTS (SELECT 1 FROM correction_grants WHERE id='grant-1' AND uses_consumed=1 AND consumed_at=4);"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM correction_requests WHERE id='correction-1';")" = "consumed"
          second="$(sqlite3 "$DB_FILE" "UPDATE correction_grants SET uses_consumed=1, consumed_at=5 WHERE id='grant-1' AND uses_consumed=0; SELECT changes();")"
          test "$second" = "0"
          test "$(sqlite3 "$DB_FILE" "SELECT consumed_at FROM correction_grants WHERE id='grant-1';")" = "4"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Impedir consumo del código si falta confirmar la primera renta
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, activation_code_hash, created_at, setup_paid_at) VALUES ('license-unpaid-rent', 'TIENDA PENDIENTE', 'pending', 3, 'activation-hash', 1, 2);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) SELECT 'patron-blocked', l.id, 'PATRON', 'install', 'continuity', x'01', 'fingerprint', 1, 'active', 3 FROM licenses l WHERE l.activation_code_hash='activation-hash' AND l.setup_paid_at IS NOT NULL AND l.first_rent_paid_at IS NOT NULL AND l.status='pending';"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM devices WHERE id='patron-blocked';")" = "0"
          test "$(sqlite3 "$DB_FILE" "SELECT activation_code_hash FROM licenses WHERE id='license-unpaid-rent';")" = "activation-hash"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM licenses WHERE id='license-unpaid-rent';")" = "pending"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar reemisión privada de códigos sin almacenar texto claro
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, activation_code_hash, created_at, setup_paid_at, first_rent_paid_at) VALUES ('license-reissue', 'TIENDA CODIGO', 'pending', 3, 'old-activation-hash', 1, 2, 2);"
          sqlite3 "$DB_FILE" "UPDATE licenses SET activation_code_hash='new-activation-hash' WHERE id='license-reissue' AND status='pending' AND setup_paid_at IS NOT NULL AND first_rent_paid_at IS NOT NULL AND NOT EXISTS (SELECT 1 FROM devices WHERE license_id='license-reissue' AND slot_number=1 AND status='active');"
          test "$(sqlite3 "$DB_FILE" "SELECT activation_code_hash FROM licenses WHERE id='license-reissue';")" = "new-activation-hash"
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, activation_code_hash, created_at) VALUES ('license-not-paid', 'TIENDA SIN PAGO', 'pending', 3, 'hash-not-paid', 1);"
          sqlite3 "$DB_FILE" "UPDATE licenses SET activation_code_hash='must-not-change' WHERE id='license-not-paid' AND status='pending' AND setup_paid_at IS NOT NULL AND first_rent_paid_at IS NOT NULL;"
          test "$(sqlite3 "$DB_FILE" "SELECT activation_code_hash FROM licenses WHERE id='license-not-paid';")" = "hash-not-paid"
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, created_at, expires_at) VALUES ('license-renew-reissue', 'TIENDA RENOVAR', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-renew-reissue', 'license-renew-reissue', 'PATRON', 'install', 'continuity', x'01', 'fingerprint', 1, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO renewal_requests (id, license_id, patron_device_id, business_name, status, code_hash, created_at, authorized_at, authorized_by, payment_reference) VALUES ('renew-reissue', 'license-renew-reissue', 'patron-renew-reissue', 'TIENDA RENOVAR', 'authorized', 'old-renewal-hash', 2, 3, 'operator', 'folio-1');"
          sqlite3 "$DB_FILE" "INSERT INTO payments (id, license_id, payment_type, amount_cents, currency, status, reference, idempotency_key, created_at, confirmed_at, confirmed_by) VALUES ('payment-renew-reissue', 'license-renew-reissue', 'MONTHLY_RENT', 8000, 'MXN', 'CONFIRMED', 'folio-1', 'renewal:renew-reissue', 3, 3, 'operator');"
          sqlite3 "$DB_FILE" "UPDATE renewal_requests SET code_hash='new-renewal-hash', authorized_at=4, authorized_by='operator' WHERE id='renew-reissue' AND status='authorized' AND EXISTS (SELECT 1 FROM payments WHERE license_id=renewal_requests.license_id AND payment_type='MONTHLY_RENT' AND status='CONFIRMED' AND idempotency_key='renewal:' || renewal_requests.id);"
          test "$(sqlite3 "$DB_FILE" "SELECT code_hash FROM renewal_requests WHERE id='renew-reissue';")" = "new-renewal-hash"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM licenses WHERE activation_code_hash IN ('old-activation-hash','new-activation-hash');")" = "1"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar recuperación de PATRON perdido y revocación de QR
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, created_at, expires_at) VALUES ('license-patron-recovery', 'TIENDA RECUPERAR', 'expired', 3, 1, 100);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-lost', 'license-patron-recovery', 'PATRON', 'old-install', 'old-continuity', x'01', 'old-fingerprint', 1, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO pairing_tokens (token_hash, license_id, patron_device_id, remaining_uses, created_at, expires_at) VALUES ('old-pair-token', 'license-patron-recovery', 'patron-lost', 2, 2, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO patron_recovery_requests (id, license_id, old_patron_device_id, code_hash, reason, status, created_at, created_by) VALUES ('recovery-1', 'license-patron-recovery', 'patron-lost', 'valid-code-hash', 'Teléfono perdido', 'pending', 3, 'operator');"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='patron-lost';")" = "active"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM patron_recovery_requests WHERE id='recovery-1';")" = "pending"
          invalid_recovery="$(sqlite3 "$DB_FILE" "UPDATE devices SET status='revoked' WHERE id='patron-lost' AND license_id='license-patron-recovery' AND device_type='PATRON' AND slot_number=1 AND status='active' AND EXISTS (SELECT 1 FROM patron_recovery_requests WHERE id='recovery-1' AND code_hash='wrong-code-hash' AND status='pending'); SELECT changes();")"
          test "$invalid_recovery" = "0"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='patron-lost';")" = "active"
          sqlite3 "$DB_FILE" "UPDATE devices SET status='revoked' WHERE id='patron-lost' AND license_id='license-patron-recovery' AND device_type='PATRON' AND slot_number=1 AND status='active' AND EXISTS (SELECT 1 FROM patron_recovery_requests WHERE id='recovery-1' AND code_hash='valid-code-hash' AND status='pending');"
          sqlite3 "$DB_FILE" "UPDATE pairing_tokens SET revoked_at=10 WHERE license_id='license-patron-recovery' AND revoked_at IS NULL AND EXISTS (SELECT 1 FROM devices WHERE id='patron-lost' AND status='revoked') AND EXISTS (SELECT 1 FROM patron_recovery_requests WHERE id='recovery-1' AND code_hash='valid-code-hash' AND status='pending');"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) SELECT 'patron-new', r.license_id, 'PATRON', 'new-install', 'new-continuity', x'02', 'new-fingerprint', 1, 'active', 11 FROM patron_recovery_requests r JOIN licenses l ON l.id=r.license_id JOIN devices old ON old.id=r.old_patron_device_id WHERE r.id='recovery-1' AND r.code_hash='valid-code-hash' AND r.status='pending' AND old.status='revoked' AND l.status IN ('active','expired') AND NOT EXISTS (SELECT 1 FROM devices d WHERE d.license_id=r.license_id AND d.slot_number=1 AND d.status='active');"
          sqlite3 "$DB_FILE" "UPDATE patron_recovery_requests SET status='consumed', consumed_at=11 WHERE id='recovery-1' AND code_hash='valid-code-hash' AND status='pending' AND EXISTS (SELECT 1 FROM devices WHERE id='patron-new' AND status='active');"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='patron-lost';")" = "revoked"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='patron-new';")" = "active"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM patron_recovery_requests WHERE id='recovery-1';")" = "consumed"
          test "$(sqlite3 "$DB_FILE" "SELECT revoked_at FROM pairing_tokens WHERE token_hash='old-pair-token';")" = "10"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM devices WHERE license_id='license-patron-recovery' AND slot_number=1 AND status='active';")" = "1"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar bandejas independientes de solicitudes y correcciones por equipo
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, business_name, status, max_devices, created_at, expires_at) VALUES ('license-inbox', 'TIENDA INBOX', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('ventas-inbox-1', 'license-inbox', 'VENTAS', 'i1', 'c1', x'01', 'f1', 2, 'active', 1), ('ventas-inbox-2', 'license-inbox', 'VENTAS', 'i2', 'c2', x'02', 'f2', 3, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO work_requests (id, license_id, ventas_device_id, request_type, details_json, status, created_at, idempotency_key) VALUES ('work-inbox-1', 'license-inbox', 'ventas-inbox-1', 'LOAN', '{}', 'pending', 2, 'work-key-1'), ('work-inbox-2', 'license-inbox', 'ventas-inbox-2', 'VACATION', '{}', 'pending', 2, 'work-key-2');"
          sqlite3 "$DB_FILE" "INSERT INTO correction_requests (id, license_id, ventas_device_id, sale_id, reason, status, created_at, idempotency_key) VALUES ('correction-inbox-1', 'license-inbox', 'ventas-inbox-1', 'sale-1', 'Error de captura', 'pending', 2, 'correction-key-1'), ('correction-inbox-2', 'license-inbox', 'ventas-inbox-2', 'sale-2', 'Producto equivocado', 'pending', 2, 'correction-key-2');"
          sqlite3 "$DB_FILE" "UPDATE work_requests SET seen_at=10 WHERE status='pending' AND seen_at IS NULL AND ventas_device_id IN (SELECT id FROM devices WHERE license_id='license-inbox' AND slot_number=2 AND status='active');"
          sqlite3 "$DB_FILE" "UPDATE correction_requests SET seen_at=10 WHERE status='pending' AND seen_at IS NULL AND ventas_device_id IN (SELECT id FROM devices WHERE license_id='license-inbox' AND slot_number=2 AND status='active');"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-inbox-1' AND status='pending' AND seen_at=10;")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-inbox-1' AND status='pending' AND seen_at=10;")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-inbox-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-inbox-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT (SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-inbox-1' AND status='pending' AND seen_at IS NULL) + (SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-inbox-1' AND status='pending' AND seen_at IS NULL);")" = "0"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')" = ""
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

