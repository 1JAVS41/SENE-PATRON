          if sqlite3 "$DB_FILE" "INSERT INTO official_support_contacts (id, official_email, help_phone_1, help_phone_2, registered_at, updated_at, updated_by) VALUES (2, 'otra@example.invalid', '+5255555555555', '+5255555555555', 101, 101, 'attacker');" 2>/dev/null; then exit 1; fi
          sqlite3 "$DB_FILE" "UPDATE official_support_contacts SET official_email='cambio@example.invalid', revision=2, updated_at=200, updated_by='operator-approved' WHERE id=1 AND revision=1;"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM official_support_contacts_audit;")" = "2"
