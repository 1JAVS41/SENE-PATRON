          sqlite3 "$DB_FILE" "UPDATE devices SET status='revoked' WHERE id='ventas-lost' AND status='active';"
          sqlite3 "$DB_FILE" "UPDATE replacement_requests SET status='approved', decided_at=10, decided_by='operator' WHERE id='replacement-1' AND status='pending' AND EXISTS (SELECT 1 FROM devices WHERE id='ventas-lost' AND status='revoked');"
          sqlite3 "$DB_FILE" "UPDATE pairing_tokens SET revoked_at=10 WHERE license_id='license-recovery' AND revoked_at IS NULL;"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('ventas-replacement', 'license-recovery', 'VENTAS', 'iv2', 'cv2', x'03', 'fv2', 2, 'active', 11);"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='ventas-lost';")" = "revoked"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM replacement_requests WHERE id='replacement-1';")" = "approved"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM devices WHERE id='ventas-replacement';")" = "active"
          test "$(sqlite3 "$DB_FILE" "SELECT revoked_at FROM pairing_tokens WHERE token_hash='pair-old';")" = "10"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Probar permiso de corrección de venta de un solo uso
        run: |
          set -euo pipefail
          DB_FILE="$(mktemp)"
          for migration in cloudflare/sene-api/migrations/*.sql; do
            sqlite3 "$DB_FILE" < "$migration"
          done
          sqlite3 "$DB_FILE" "INSERT INTO licenses (id, status, max_devices, created_at, expires_at) VALUES ('license-correction', 'active', 3, 1, 9999999999);"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('patron-correction', 'license-correction', 'PATRON', 'ip', 'cp', x'01', 'fp', 1, 'active', 1), ('ventas-correction', 'license-correction', 'VENTAS', 'iv', 'cv', x'02', 'fv', 2, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO correction_requests (id, license_id, ventas_device_id, sale_id, reason, reasons_json, cash_impact, cash_reason, plan_hash, status, created_at, idempotency_key) VALUES ('correction-1', 'license-correction', 'ventas-correction', 'sale-42', 'Corrección de cantidad', '[\"Corrección de cantidad\"]', 1, 'Cantidad corregida', 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', 'pending', 2, 'idem-1');"
          sqlite3 "$DB_FILE" "INSERT INTO work_requests (id, license_id, ventas_device_id, request_type, details_json, status, created_at, idempotency_key) VALUES ('work-1', 'license-correction', 'ventas-correction', 'LOAN', '{}', 'pending', 2, 'work-idem-1');"
          sqlite3 "$DB_FILE" "INSERT INTO devices (id, license_id, device_type, installation_id, continuity_id, public_key, fingerprint, slot_number, status, created_at) VALUES ('ventas-correction-2', 'license-correction', 'VENTAS', 'iv2', 'cv2', x'03', 'fv2', 3, 'active', 1);"
          sqlite3 "$DB_FILE" "INSERT INTO work_requests (id, license_id, ventas_device_id, request_type, details_json, status, created_at, idempotency_key) VALUES ('work-2', 'license-correction', 'ventas-correction-2', 'LOAN', '{}', 'pending', 2, 'work-idem-2');"
          test "$(sqlite3 "$DB_FILE" "SELECT (SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL) + (SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL);")" = "2"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          sqlite3 "$DB_FILE" "UPDATE work_requests SET seen_at=3 WHERE id='work-1' AND status='pending' AND seen_at IS NULL;"
          test "$(sqlite3 "$DB_FILE" "SELECT (SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL) + (SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL);")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          sqlite3 "$DB_FILE" "UPDATE correction_requests SET seen_at=4 WHERE id='correction-1' AND status='pending' AND seen_at IS NULL;"
          test "$(sqlite3 "$DB_FILE" "SELECT (SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL) + (SELECT COUNT(*) FROM correction_requests WHERE ventas_device_id='ventas-correction' AND status='pending' AND seen_at IS NULL);")" = "0"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE ventas_device_id='ventas-correction-2' AND status='pending' AND seen_at IS NULL;")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM work_requests WHERE id='work-1' AND status='pending';")" = "1"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM correction_requests WHERE id='correction-1' AND status='pending' AND length(plan_hash)=64 AND cash_impact=1 AND cash_reason='Cantidad corregida';")" = "1"
          if sqlite3 "$DB_FILE" "INSERT INTO correction_requests (id, license_id, ventas_device_id, sale_id, reason, status, created_at, idempotency_key) VALUES ('correction-duplicate', 'license-correction', 'ventas-correction', 'sale-42', 'Otro', 'pending', 3, 'idem-duplicate');" 2>/dev/null; then
            echo "ERROR: se permitió una segunda solicitud activa para la misma venta"
            exit 1
          fi
          sqlite3 "$DB_FILE" "UPDATE correction_requests SET status='approved', decided_at=5 WHERE id='correction-1' AND status='pending';"
          sqlite3 "$DB_FILE" "INSERT INTO correction_grants (id, request_id, license_id, ventas_device_id, sale_id, plan_hash, uses_allowed, uses_consumed, created_at) SELECT 'grant-1', id, license_id, ventas_device_id, sale_id, plan_hash, 1, 0, 3 FROM correction_requests WHERE id='correction-1' AND status='approved';"
          test "$(sqlite3 "$DB_FILE" "SELECT COUNT(*) FROM correction_grants WHERE request_id='correction-1' AND uses_allowed=1 AND uses_consumed=0;")" = "1"
          sqlite3 "$DB_FILE" "UPDATE correction_grants SET uses_consumed=1, consumed_at=4 WHERE id='grant-1' AND request_id='correction-1' AND license_id='license-correction' AND ventas_device_id='ventas-correction' AND sale_id='sale-42' AND plan_hash='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' AND uses_consumed=0;"
          sqlite3 "$DB_FILE" "UPDATE correction_requests SET status='consumed' WHERE id='correction-1' AND status='approved' AND EXISTS (SELECT 1 FROM correction_grants WHERE id='grant-1' AND uses_consumed=1 AND consumed_at=4);"
          test "$(sqlite3 "$DB_FILE" "SELECT status FROM correction_requests WHERE id='correction-1';")" = "consumed"
          # Simula la repetición tras perder la respuesta HTTPS: solo el mismo
          # request, permiso, licencia, equipo y venta deben reconocer el consumo.
          replay="$(sqlite3 "$DB_FILE" "SELECT g.consumed_at FROM correction_grants g JOIN correction_requests r ON r.id=g.request_id WHERE g.id='grant-1' AND g.request_id='correction-1' AND g.license_id='license-correction' AND g.ventas_device_id='ventas-correction' AND g.sale_id='sale-42' AND g.uses_allowed=1 AND g.uses_consumed=1 AND r.status='consumed' AND r.license_id='license-correction' AND r.ventas_device_id='ventas-correction' AND r.sale_id='sale-42' AND g.plan_hash='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' AND r.plan_hash='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' LIMIT 1;")"
          test "$replay" = "4"
          mismatch="$(sqlite3 "$DB_FILE" "SELECT g.consumed_at FROM correction_grants g JOIN correction_requests r ON r.id=g.request_id WHERE g.id='grant-1' AND g.request_id='correction-1' AND g.license_id='license-correction' AND g.ventas_device_id='another-device' AND g.sale_id='sale-42' AND g.uses_allowed=1 AND g.uses_consumed=1 AND r.status='consumed' AND r.license_id='license-correction' AND r.ventas_device_id='another-device' AND r.sale_id='sale-42' LIMIT 1;")"
          test -z "$mismatch"
          second="$(sqlite3 "$DB_FILE" "UPDATE correction_grants SET uses_consumed=1, consumed_at=5 WHERE id='grant-1' AND uses_consumed=0; SELECT changes();")"
          test "$second" = "0"
          test "$(sqlite3 "$DB_FILE" "SELECT consumed_at FROM correction_grants WHERE id='grant-1';")" = "4"
          test -z "$(sqlite3 "$DB_FILE" 'PRAGMA foreign_key_check;')"
          test "$(sqlite3 "$DB_FILE" 'PRAGMA integrity_check;')" = "ok"

      - name: Impedir consumo del código si falta confirmar la primera renta
        run: |
