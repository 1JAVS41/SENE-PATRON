name: Deploy SENE testing Worker

on:
  push:
    branches:
      - sene-cloudflare-backend
      - integration/ack-universal
    paths:
      - "cloudflare/sene-api/**"
      - ".github/workflows/deploy-cloudflare-testing.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-testing:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: "4f666119f747154055a6d0a04dece552"
      SENE_TEST_OPERATOR_TOKEN: ${{ secrets.SENE_TEST_OPERATOR_TOKEN }}
      SENE_TEST_PAIRING_TOKEN_ENCRYPTION_KEY: ${{ secrets.SENE_TEST_PAIRING_TOKEN_ENCRYPTION_KEY }}
      SENE_TEST_CONTACTS_SIGNING_PRIVATE_JWK: ${{ secrets.SENE_TEST_CONTACTS_SIGNING_PRIVATE_JWK }}
      SENE_TEST_ADMIN_LOGIN_EMAIL: ${{ secrets.SENE_TEST_ADMIN_LOGIN_EMAIL }}
      SENE_TEST_ADMIN_PASSWORD_HASH: ${{ secrets.SENE_TEST_ADMIN_PASSWORD_HASH }}
      SENE_TEST_ADMIN_PASSWORD_SALT: ${{ secrets.SENE_TEST_ADMIN_PASSWORD_SALT }}
      SENE_TEST_ADMIN_SESSION_SECRET: ${{ secrets.SENE_TEST_ADMIN_SESSION_SECRET }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar credenciales y secretos exclusivos de pruebas
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Falta el secreto CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$SENE_TEST_OPERATOR_TOKEN" || { echo "Falta el secreto SENE_TEST_OPERATOR_TOKEN"; exit 1; }
          [[ "$SENE_TEST_OPERATOR_TOKEN" != *$'\n'* ]] || { echo "SENE_TEST_OPERATOR_TOKEN no puede contener saltos de línea"; exit 1; }
          [[ "$SENE_TEST_OPERATOR_TOKEN" =~ .{32,} ]] || { echo "SENE_TEST_OPERATOR_TOKEN debe tener al menos 32 caracteres"; exit 1; }
          [[ "$SENE_TEST_PAIRING_TOKEN_ENCRYPTION_KEY" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "SENE_TEST_PAIRING_TOKEN_ENCRYPTION_KEY debe contener exactamente 64 caracteres hexadecimales"; exit 1; }
          admin_secret_count=0
          for value in "$SENE_TEST_ADMIN_LOGIN_EMAIL" "$SENE_TEST_ADMIN_PASSWORD_HASH" "$SENE_TEST_ADMIN_PASSWORD_SALT" "$SENE_TEST_ADMIN_SESSION_SECRET"; do
            [[ -n "$value" ]] && admin_secret_count=$((admin_secret_count + 1))
          done
          if [ "$admin_secret_count" -ne 0 ] && [ "$admin_secret_count" -ne 4 ]; then
            echo "Configura los cuatro secretos SENE_TEST_ADMIN_* juntos o deja los cuatro vacíos."
            exit 1
          fi
          if [ "$admin_secret_count" -eq 4 ]; then
            [[ "$SENE_TEST_ADMIN_LOGIN_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || { echo "Correo admin de pruebas no válido"; exit 1; }
            [[ "$SENE_TEST_ADMIN_PASSWORD_HASH" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "El hash admin debe ser SHA-256 hexadecimal de 64 caracteres"; exit 1; }
            [[ "$SENE_TEST_ADMIN_PASSWORD_SALT" =~ ^[A-Za-z0-9+/]{20,}={0,2}$ ]] || { echo "El salt admin debe estar codificado en Base64"; exit 1; }
            [[ "$SENE_TEST_ADMIN_SESSION_SECRET" =~ .{32,} ]] || { echo "El secreto de sesión admin debe tener al menos 32 caracteres"; exit 1; }
          fi

      - name: Aplicar migraciones únicamente a D1 de pruebas
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply sene-licencias-pruebas --remote --config cloudflare/sene-api/wrangler.testing.toml

      - name: Verificar migraciones aplicadas en D1 de pruebas
        shell: bash
        run: |
          set -euo pipefail
          find cloudflare/sene-api/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\\n' | sort | tee /tmp/sene-local-migrations.log
          grep -q '^0022_admin_event_lifecycle.sql
      - name: Desplegar Worker aislado de pruebas
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/sene-api/wrangler.testing.toml 2>&1 | tee /tmp/sene-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/sene-deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Wrangler no devolvió una URL workers.dev verificable."
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          printf '%s' "$SENE_TEST_OPERATOR_TOKEN" | npx --yes wrangler@4 secret put OPERATOR_TOKEN --config cloudflare/sene-api/wrangler.testing.toml
          printf '%s' "$SENE_TEST_PAIRING_TOKEN_ENCRYPTION_KEY" | npx --yes wrangler@4 secret put PAIRING_TOKEN_ENCRYPTION_KEY --config cloudflare/sene-api/wrangler.testing.toml
          if [ -n "$SENE_TEST_CONTACTS_SIGNING_PRIVATE_JWK" ]; then
            printf '%s' "$SENE_TEST_CONTACTS_SIGNING_PRIVATE_JWK" | npx --yes wrangler@4 secret put CONTACTS_SIGNING_PRIVATE_JWK --config cloudflare/sene-api/wrangler.testing.toml
          else
            echo "Aviso: CONTACTS_SIGNING_PRIVATE_JWK no está configurada; AYUDA firmado no estará disponible en este entorno."
          fi
          if [ -n "$SENE_TEST_ADMIN_LOGIN_EMAIL" ]; then
            printf '%s' "$SENE_TEST_ADMIN_LOGIN_EMAIL" | npx --yes wrangler@4 secret put ADMIN_LOGIN_EMAIL --config cloudflare/sene-api/wrangler.testing.toml
            printf '%s' "$SENE_TEST_ADMIN_PASSWORD_HASH" | npx --yes wrangler@4 secret put ADMIN_PASSWORD_HASH --config cloudflare/sene-api/wrangler.testing.toml
            printf '%s' "$SENE_TEST_ADMIN_PASSWORD_SALT" | npx --yes wrangler@4 secret put ADMIN_PASSWORD_SALT --config cloudflare/sene-api/wrangler.testing.toml
            printf '%s' "$SENE_TEST_ADMIN_SESSION_SECRET" | npx --yes wrangler@4 secret put ADMIN_SESSION_SECRET --config cloudflare/sene-api/wrangler.testing.toml
          else
            echo "Aviso: acceso SENE ADMIN no configurado; el login devolverá ADMIN_AUTH_NOT_CONFIGURED."
          fi

      - name: Verificar Worker de pruebas
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" | tee /tmp/sene-health.json
          grep -q '"status":"ok"' /tmp/sene-health.json
          echo "Worker de pruebas operativo: $WORKER_URL"
 /tmp/sene-local-migrations.log
          npx --yes wrangler@4 d1 execute sene-licencias-pruebas --remote --config cloudflare/sene-api/wrangler.testing.toml --command "SELECT name FROM d1_migrations ORDER BY id;" | tee /tmp/sene-d1-migrations.log
          grep -q '0022_admin_event_lifecycle' /tmp/sene-d1-migrations.log

      - name: Desplegar Worker aislado de pruebas
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config cloudflare/sene-api/wrangler.testing.toml 2>&1 | tee /tmp/sene-deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/sene-deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Wrangler no devolvió una URL workers.dev verificable."
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          printf '%s' "$SENE_TEST_OPERATOR_TOKEN" | npx --yes wrangler@4 secret put OPERATOR_TOKEN --config cloudflare/sene-api/wrangler.testing.toml
          printf '%s' "$SENE_TEST_PAIRING_TOKEN_ENCRYPTION_KEY" | npx --yes wrangler@4 secret put PAIRING_TOKEN_ENCRYPTION_KEY --config cloudflare/sene-api/wrangler.testing.toml
          if [ -n "$SENE_TEST_CONTACTS_SIGNING_PRIVATE_JWK" ]; then
            printf '%s' "$SENE_TEST_CONTACTS_SIGNING_PRIVATE_JWK" | npx --yes wrangler@4 secret put CONTACTS_SIGNING_PRIVATE_JWK --config cloudflare/sene-api/wrangler.testing.toml
          else
            echo "Aviso: CONTACTS_SIGNING_PRIVATE_JWK no está configurada; AYUDA firmado no estará disponible en este entorno."
          fi
          if [ -n "$SENE_TEST_ADMIN_LOGIN_EMAIL" ]; then
            printf '%s' "$SENE_TEST_ADMIN_LOGIN_EMAIL" | npx --yes wrangler@4 secret put ADMIN_LOGIN_EMAIL --config cloudflare/sene-api/wrangler.testing.toml
            printf '%s' "$SENE_TEST_ADMIN_PASSWORD_HASH" | npx --yes wrangler@4 secret put ADMIN_PASSWORD_HASH --config cloudflare/sene-api/wrangler.testing.toml
            printf '%s' "$SENE_TEST_ADMIN_PASSWORD_SALT" | npx --yes wrangler@4 secret put ADMIN_PASSWORD_SALT --config cloudflare/sene-api/wrangler.testing.toml
            printf '%s' "$SENE_TEST_ADMIN_SESSION_SECRET" | npx --yes wrangler@4 secret put ADMIN_SESSION_SECRET --config cloudflare/sene-api/wrangler.testing.toml
          else
            echo "Aviso: acceso SENE ADMIN no configurado; el login devolverá ADMIN_AUTH_NOT_CONFIGURED."
          fi

      - name: Verificar Worker de pruebas
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" | tee /tmp/sene-health.json
          grep -q '"status":"ok"' /tmp/sene-health.json
          echo "Worker de pruebas operativo: $WORKER_URL"
