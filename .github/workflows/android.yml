name: Android build

on:
  push:
    branches: [ "sene-patron-development" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/SENE-PATRON.apk
      - name: Upload SENE PATRÓN APK
        uses: actions/upload-artifact@v4
        with:
          name: SENE-PATRON
          path: app/build/outputs/apk/debug/SENE-PATRON.apk
