name: Android APK

on:
  push:
    branches:
      - sene-patron-development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Preparar nombre comercial del APK
        run: cp build/outputs/apk/debug/*.apk build/outputs/apk/debug/SENE-PATRON.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SENE-PATRON
          path: build/outputs/apk/debug/SENE-PATRON.apk
          if-no-files-found: error
          retention-days: 14
