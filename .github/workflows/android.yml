name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Generar icono con el logotipo original SENE azul y verde
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image
          src = Image.open('src/main/res/drawable-nodpi/logo_sene_pv.png').convert('RGBA')
          pxout = Image.new('RGBA', (512, 512), (8, 8, 8, 255))
          src.thumbnail((470, 470), Image.Resampling.LANCZOS)
          pxout.alpha_composite(src, ((512-src.width)//2, (512-src.height)//2))
          pxout.save('src/main/res/drawable-nodpi/ic_launcher_patron.png')
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y herramientas Android
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Preparar nombre comercial del APK
        run: cp build/outputs/apk/debug/*.apk "build/outputs/apk/debug/SENE PATRON-online.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SENE PATRON-online
          path: build/outputs/apk/debug/SENE PATRON-online.apk
          if-no-files-found: error
          retention-days: 14