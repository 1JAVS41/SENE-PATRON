name: Build SENE PATRÓN test APK

on:
  push:
    branches:
      - sene-cloudflare-backend
      - integration/ack-universal
    paths:
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "cloudflare/sene-api/**"
      - ".github/workflows/build-test-apk.yml"
  workflow_dispatch:

concurrency:
  group: sene-patron-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Pruebas de backend, ACK y migraciones SQLite
        run: |
          cp cloudflare/sene-api/src/worker.js cloudflare/sene-api/src/worker.mjs
          node cloudflare/sene-api/tests/admin-auth.test.mjs
          node cloudflare/sene-api/tests/universal-ack.test.mjs
          python3 cloudflare/sene-api/tests/admin-event-migrations.test.py
      - name: Instalar Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Compilar APK de pruebas
        run: gradle --no-daemon assembleDebug
      - name: Localizar APK para prueba de arranque
        id: apk
        shell: bash
        run: |
          APK_PATH="$(find "$GITHUB_WORKSPACE/build/outputs/apk" -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK_PATH" && test -s "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
      - name: Verificar identidad y recursos del APK
        shell: bash
        run: |
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"
          grep -F "name='com.sene.patron'" <<< "$BADGING"
          grep -F "application-label:'SENE PATRÓN'" <<< "$BADGING"
          unzip -l "$APK" | grep -q 'logo_sene_pv'
          sha256sum "$APK"
      - name: Smoke test de arranque en emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-snapshot-save
          script: |
            set -euo pipefail
            test -n "$APK_PATH" && test -s "$APK_PATH"
            adb wait-for-device
            for attempt in $(seq 1 180); do
              BOOTED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              [ "$BOOTED" = "1" ] && break
              sleep 2
            done
            [ "$(adb shell getprop sys.boot_completed | tr -d '\\r')" = "1" ]
            adb devices -l
            adb install -r "$APK_PATH"
            adb shell am force-stop com.sene.patron
            adb shell am start -W -n com.sene.patron/.MainActivity
            for attempt in $(seq 1 30); do
              PID="$(adb shell pidof com.sene.patron 2>/dev/null | tr -d '\\r' || true)"
              [ -n "$PID" ] && exit 0
              sleep 1
            done
            adb logcat -d -t 1000
            exit 1
      - name: Preparar nombre de entrega
        run: |
          mkdir -p dist
          APK="$(find build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          cp "$APK" "dist/SENE PATRON-online.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SENE PATRON-online
          path: dist/SENE PATRON-online.apk
          if-no-files-found: error
          retention-days: 14
